[project]
name = "ops-portal-demo"
version = "0.1.0"
description = "Internal operations portal prototype (refunds workflow + read-only KYC queue)"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "whitenoise>=6.9,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "a2wsgi>=1.10,<2",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
Django = ">=5.2,<5.3"
whitenoise = ">=6.9,<7"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
a2wsgi = ">=1.10,<2"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "portal", "core", "refunds", "kyc"]
